# I test verifiserer vi at Spring-konteksten + SQLite-datakilden laster uten feil.
# MCP-serveren (stdio) slås av, ellers ville den blokkere testen på lesing fra stdin.
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.stdio=false

# spring-boot-starter-web kom inn på klassestien med T-17 (Streamable HTTP). Denne fila
# skygger for src/main/resources/application.properties, så `none` må gjentas her — ellers
# kan testkonteksten plutselig bli en webapplikasjon.
spring.main.web-application-type=none

spring.datasource.url=jdbc:sqlite:build/test-vacation.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
