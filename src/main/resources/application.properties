spring.application.name=vacation-booking-mcp

# --- MCP-server: stdio-transport (Claude kobler seg til over stdin/stdout) ---
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=vacation-booking-mcp
spring.ai.mcp.server.version=0.0.1

# stdio eier stdout for JSON-RPC. Banner og logging rutes derfor til stderr (synlig i
# IntelliJ/konsoll) + fil, via logback-spring.xml. stdout holdes 100% rent for protokollen.
spring.main.banner-mode=log

# spring-boot-starter-web ligger på klassestien (via spring-ai-starter-mcp-server-webmvc,
# se T-17), men i stdio-modus skal det IKKE starte noen Tomcat. Uten denne linja ville
# Spring Boot utledet en servlet-applikasjon fra klassestien og bundet en port.
# `--spring.profiles.active=http` overstyrer til servlet igjen (application-http.properties).
spring.main.web-application-type=none

# Logg navnene på registrerte MCP-tools ved oppstart (til konsoll/stderr). true|false
workshop.log-registered-tools=true

# --- SQLite-datakilde (på plass fra dag én; skjema + seed kjøres ved oppstart) ---
spring.datasource.url=jdbc:sqlite:vacation.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
