# --- Profil `http` (T-17): Streamable HTTP-transport i stedet for stdio ---
#
# Aktiveres med:
#   java -jar build/libs/vacation-booking-mcp-0.0.1-SNAPSHOT.jar --spring.profiles.active=http
#   (eller SPRING_PROFILES_ACTIVE=http java -jar …)
#
# Uten profilen er serveren fortsatt en ren stdio-server — se application.properties.

# Slå av stdio-transporten. Dette er den viktigste linja: alle webmvc-autokonfigurasjonene
# i Spring AI er betinget av McpServerStdioDisabledCondition, altså stdio=false.
spring.ai.mcp.server.stdio=false

# Velg Streamable HTTP. Merk at feltet i McpServerProperties har STREAMABLE som default-verdi,
# men @ConditionalOnProperty leser miljøet direkte og har matchIfMissing=false for STREAMABLE —
# står ikke linja her, faller autokonfigurasjonen tilbake på (deprecated) SSE.
spring.ai.mcp.server.protocol=STREAMABLE

# Slå på webserveren igjen (application.properties setter den til `none` for stdio).
spring.main.web-application-type=servlet
server.port=8080

# Endepunktet blir POST/GET/DELETE http://localhost:8080/mcp
# (default fra McpServerStreamableHttpProperties.mcpEndpoint — endres med linja under).
# spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# --- Bearer-token-auth (T-18) ---
#
# Gjelder KUN denne profilen: i stdio-modus finnes ingen nettverksflate å beskytte.
# Implementasjonen er BearerTokenAuthFilter (@Profile("http")) — et vanlig servletfilter,
# ikke Spring Security. Alle forespørsler må ha `Authorization: Bearer <token>`.
#
# Settes helst som miljøvariabel, så tokenet ikke havner i git:
#   WORKSHOP_HTTP_AUTH_TOKEN=hemmelig-token java -jar build/libs/…jar --spring.profiles.active=http
# eller på kommandolinja:
#   java -jar …jar --spring.profiles.active=http --workshop.http.auth.token=hemmelig-token
#
# Står den tom (som her), GENERERER serveren et tilfeldig token ved oppstart og skriver det i
# loggen. Da er endepunktet aldri åpent ved et uhell, og du slipper likevel å finne på et token
# for å komme i gang. Tokenet er nytt for hver omstart.
workshop.http.auth.token=

# Nødbrems for demo/feilsøking: false skrur av sjekken helt, med et tydelig WARN ved oppstart.
workshop.http.auth.enabled=true

# I HTTP-modus eier ikke protokollen stdout lenger — JSON-RPC går over HTTP-body/SSE.
# Da er det greit (og hyggeligere) å logge til konsollet igjen. logback-spring.xml bytter
# STDERR-appenderen mot STDOUT for denne profilen, og banneret kan gå rett i konsollet.
spring.main.banner-mode=console
